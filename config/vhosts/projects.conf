<VirtualHost *:80>
    ServerAdmin webmaster@projects.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}/projects
    ServerName projects.localhost:80
    ServerAlias 192.168.1.53
    SetEnv WEBGOEZ_LOCAL_APK_DOWNLOAD 1
	<Directory ${APACHE_DOCUMENT_ROOT}/projects>
		AllowOverride all
        Options +Indexes +Includes +FollowSymLinks +MultiViews +ExecCGI
        Require all granted
	</Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@projects.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}/projects
    ServerName projects.localhost:443
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/ssl.crt"
    SSLCertificateKeyFile "/etc/apache2/ssl/ssl.key"
	<Directory ${APACHE_DOCUMENT_ROOT}/projects>
		AllowOverride all
        Options +Indexes +Includes +FollowSymLinks +MultiViews +ExecCGI
        Require all granted
	</Directory>
</VirtualHost>