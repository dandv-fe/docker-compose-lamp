<script type="text/javascript">
  const userName= sessionStorage.getItem('userNameEmpleado')
  const empleadoName= sessionStorage.getItem('empleado')
  const empleadoFoto= sessionStorage.getItem('fotoEmpleado')
  const empresa= sessionStorage.getItem('empresa')
  var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000
    });
  jQuery(document).ready(function() {
    if (!userName && !empleadoName && !empleadoFoto){
      $(location).attr("href", "login.php");
    }
    $("#userNameEmpleado").text(empleadoName)
    $("#fotoEmpleado").attr('src',empleadoFoto)
    $("#lockscreen-usuario-empleado").css('display','block')

    $("#form-lockscreen-credentials").submit((e)=>{
      e.preventDefault();
      const pass=$("#passwordEmpleado").val();
      $.getJSON("ajax/UsuarioAjax.php?op=IngresarSistema",{empresa,user: userName, pass: pass,w1:window.name},function (r) {
        if (r?.nombre) {
              sessionStorage.setItem('empresa', r.empresa)
              sessionStorage.setItem('userNameEmpleado', r.usuario)
              sessionStorage.setItem('empleado', r.nombre)
              sessionStorage.setItem('fotoEmpleado', r.foto)
              sessionStorage.setItem('session', r.session)
              window.name=r.session;
              location.reload();
          }else if(r===0){
            Toast.fire({
                        icon: 'error',
                        title: "Todos los campos son requeridos"
                    })
          } else {
            Toast.fire({
                        icon: 'error',
                        title: "Error en los datos "
                    })
                    $("#passwordEmpleado").val("");
          $("#passwordEmpleado").focus();
          }
       
       
       
       
      });
    })




  });

          if (typeof (Worker) !== "undefined") {
              if (typeof (w) == "undefined") {
                  w = new Worker("dist/scripts/workers/isSession.js?v=<?php echo $infoSistemaCuentas['version']; ?>");
              }
              w.onmessage = function (event) {
                  console.log(event.data);
                  location.reload(true);
              };
          } else {
              alert('ERROR EN EL NAVEGADOR NO SOPORTADO')
          }
      }

      function stopWorker() {
          w.terminate();
          w = undefined;
      }
      startWorker()
  });
