<script type="text/javascript">
    $(function () {
        $('#modal-CambioEstado').on('show.bs.modal', function (e) {
            $("#formCambioEstado").trigger('reset');
            let id = parseInt(sessionStorage.getItem('index'))
            $("#txtRefTarjetaCambiEstado").val($("#txtrefTarjetaHidden").val());
            $("#txtmodalEstado").text(ArrayTarjetas[id].estado);
            $("#ptxtInformacion1").addClass('hide');
            $("#divOtroEstado").addClass('hide');
        })
        $("#formCambioEstado").submit(function (e) {
            e.preventDefault();
            $.post("./ajax/UsuarioAjax.php", function (r) {
                if (r === '0') {
                    location.reload(true);
                }
            });
            var formData = new FormData($("form#formCambioEstado")[0]);

            $.ajax({

                url: "./ajax/CarteraAjax.php?op=UpdateEstado",
                type: "POST",
                data: formData,
                contentType: false,
                processData: false,
                success: function (datos) {

                    if (datos.indexOf("ERROR:") !== -1) {
                        Toast.fire({
                            icon: 'error',
                            title: datos
                        })
                    } else {
                        Toast.fire({
                            icon: 'success',
                            title: datos
                        })
                        $('#modal-CambioEstado').modal('hide');
                        listarRuta();
                    }

                }

            });
        });
    });
</script>
