<script type="text/javascript">
    $(function () {
        

        $('#modal-NuevaContabilidad').on('show.bs.modal', function (e) {
            ComboTipoContabilidad()
        })
       
        $('#modal-NuevaContabilidad').on('hidden.bs.modal', function (e) {
           $("form#formNuevaContabilidad").trigger('reset');
           $( "form#formNuevaContabilidad input:hidden" ).val('')
           $("#divcboNomina").addClass('hide')
           $("#cboNomina").attr('required',false)
        })
        
        function ComboTipoContabilidad() {
            const operacion = $("#txtOperacionContabilidad").val()
            $.post("./ajax/UsuarioAjax.php", function (r) {
                if (r === '0') {
                    location.reload(true);
                }
            });
            $.get("./ajax/RecibirCuentasAjax.php?op=listTipoContabilidadS", { operacion }, function (r) {
                $("#cboTipo_contabilidad").html(r);

            })
        }

    });
</script>
