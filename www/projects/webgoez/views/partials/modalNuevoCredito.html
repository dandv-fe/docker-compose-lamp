<script type="text/javascript">
  function onChangeRdo(e) {
    sessionStorage.setItem('rdo', $(e).attr('id'))
  }


  $(function () {



    $('body').on('focus', '.inputForNuevoCredito', function (e) {

      $(e.target).prev().addClass('top');
      $(e.target).prev().addClass('badge-success');
      $(e.target).prev().addClass('focus');
      $(e.target).parent().addClass('focus')
    });

    $('body').on('blur', '.inputForNuevoCredito', function (e) {

      const input = $(e.target).val()

      if (input.trim() == '') {
        $(e.target).prev().removeClass('top');
        $(e.target).prev().removeClass('badge-success');
      }
      $(e.target).prev().removeClass('focus');
      $(e.target).parent().removeClass('focus')
    });



    $('#modal-nuevo-credito').on('show.bs.modal', function (e) {
      banderasavedcredito = 0
      if (screen.width < 360) {
        const rdoPrimera = 'Pri';
        const rdoAntes = 'Ant';
        const rdoDespues = 'Des';
        const rdoUltima = 'Ult';
        $("#rdoPrimera").next().text(rdoPrimera);
        $("#rdoAntes").next().text(rdoAntes);
        $("#rdoDespues").next().text(rdoDespues);
        $("#rdoUltima").next().text(rdoUltima);
      }

      verFormPanel()
      $("#txtserieview").text($("#txt_ultima_serieHidden").val());
      // $("#txtObligacion").val($("#txt_ultimo_numeroHidden").val());
      if ($("#txtConsepto").val() === 'Articulo') {
        $("#divDescipcionArticuloInicial").show();
        $(".divSeguroFormNuevoCredito").hide();
      } else {
        $("#divDescipcionArticuloInicial").hide();
        $(".divSeguroFormNuevoCredito").show();
      }
      $("#txtCuotaInicial").trigger('input');


      //resetStyleFormNuevoPrestamo()
      setTimeout(obligacionFocus, 300)
      const rdo = sessionStorage.getItem('rdo');
      if (rdo) {

        $("#" + rdo + "").attr('checked', true);
      } else {
        sessionStorage.setItem('rdo', 'rdoAntes')
        $("#rdoAntes").attr('checked', true);
      }
    })
    function obligacionFocus() {
      $("#txtValor").focus();
    }

    $('#modal-nuevo-credito').on('hidden.bs.modal', function (e) {
      $("#formSaveNewCredit button").attr('disabled', false);
      $('#formSaveNewCredit').trigger("reset");
      $("#cboBancoPagoCredito").val('0').trigger('change');
      $("#txtCuotaInicial").trigger('input');
    })

  });
</script>
