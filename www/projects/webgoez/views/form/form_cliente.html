
<form role="form" name="frmCliente" id="frmCliente" enctype="multipart/form-data">
    <div class="row">
  
  
      <div class="col-md-8">
        <div class="form-group has-success">
          <input id="txtBanderin" type="hidden" maxlength="50" class="form-control" name="txtBanderin"
                 placeholder="" value="0" />
          <input id="txtId_Cliente" type="hidden" maxlength="50" class="form-control" name="txtId_Cliente"
                 placeholder="" autofocus="" />
          <input id="txt_Num_Documento" type="hidden" maxlength="45" name="txt_Num_Documento" placeholder=""
                 class="form-control" />
          <label for="txt_Nombre">Nombre:</label>
          <input id="txt_Nombre" type="text" maxlength="50" name="txt_Nombre" required=""
                 class="form-control" placeholder="Nombre Completo" autofocus="" />
        </div>
  
      </div>
  
      <div class="col-md-4">
        <div class="form-group has-success">
          <label for="txt_RutaImgCli">Foto:</label>
          <input id="imagen_Cli" type="file" class="form-control" name="imagen_Cli" />
          <input id="txt_RutaImgCli" type="text" class="form-control" name="txt_RutaImgCli" />
        </div>
  
      </div>
  
    </div>
  
    <div class="row">
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Apodo">Apodo:</label>
          <input id="txt_Apodo" type="text" maxlength="20" name="txt_Apodo" class="form-control"
                 placeholder="Ingrese el Apodo"  />
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Sexo">Sexo:</label>
          <select name="txt_Sexo" id="txt_Sexo" class="form-control" required>
            <option value="">--selecione--</option>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Otro">Otro</option>
          </select>
  
        </div>
  
      </div>
  
      <div class="col-md-2">
        <div class="form-group has-success">
          <label for="txt_fechaNacimiento">Fecha Nacimiento:</label>
          <input id="txt_fechaNacimiento" type="date" maxlength="2" name="txt_fechaNacimiento" class="form-control"
                 placeholder="Fecha de Nacimiento" />
        </div>
  
      </div>
      <div class="col-md-4">
        <div class="form-group has-success">
          <label for="txt_Ocupacion">Ocupacion:</label>
          <input id="txt_Ocupacion" type="text" maxlength="50" name="txt_Ocupacion" class="form-control"
                 placeholder="Ingrese el Ocopacion" required="" />
        </div>
  
      </div>
    </div>
    <div class="row">
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="cboTipo_Documento">Tipo Documento:</label>
          <select id="cboTipo_Documento" name="cboTipo_Documento" class="form-control"></select>
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Num_Documentoiul">Documento:</label>
          <input id="txt_Num_Documentoiul" type="text" maxlength="45" name="txt_Num_Documentoiul"
                 placeholder="" class="form-control" disabled />
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Telefono">Teléfono:</label>
          <input id="txt_Telefono" type="number" maxlength="13" name="txt_Telefono" class="form-control"
                 placeholder="Ingrese el teléfono" required="" />
        </div>
  
      </div>
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Email">Email:</label>
          <input id="txt_Email" type="email" maxlength="50" name="txt_Email" class="form-control"
                 placeholder="Ingrese el email" />
        </div>
      </div>
    </div>
  
    <div class="row">
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Direccion_Departamento">Departamento:</label>
          <input id="txt_Direccion_Departamento" type="text" maxlength="45"
                 name="txt_Direccion_Departamento" placeholder="Departamento" class="form-control" />
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Direccion_Provincia">Ciudad:</label>
          <input id="txt_Direccion_Provincia" type="text" maxlength="45" name="txt_Direccion_Provincia"
                 class="form-control" placeholder="Ciudad" required=""/>
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Direccion_Distrito">Barrio:</label>
          <input id="txt_Direccion_Distrito" type="text" maxlength="45" name="txt_Direccion_Distrito"
                 class="form-control" placeholder="Barrio" required/>
        </div>
  
      </div>
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Direccion_Calle">Direcion/Calle:</label>
          <input id="txt_Direccion_Calle" type="text" maxlength="45" name="txt_Direccion_Calle"
                 placeholder="" class="form-control" />
        </div>
  
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="form-group has-success">
          <label for="txt_Nota_Cliente">Textarea</label>
          <textarea id="txt_Nota_Cliente" name="txt_Nota_Cliente" class="form-control" rows="3" placeholder="Nota ..."></textarea>
        </div>
  
      </div>
  
      <div class="col-md-3">
        <div class="form-group has-success">
          <label for="txt_Estado">Estado:</label>
          <select class="form-control" id="txt_Estado" name="txt_Estado">
            <option>A</option>
            <option>C</option>
          </select>
          <hr>
        </div>
  
      </div>
  
  
    </div>
  
  
    <div class="row">
      <div class="col-xs-8">
        <p>Opciones</p>
        <button class="btn btn-success" type="submit"><i class="fa fa-floppy-o"></i> Registrar</button>
        <a id="btnNuevoClentePanel" href="#" class="btn btn-primary"><i class="fa fa-remove"></i>
          Cancelar</a>
        <hr>
        <span class="lead text-primary"></span>
      </div>
  
    </div>
  </form>
