<script type="text/javascript">
  $("#li-consultaCobros").addClass('menu-open')
  $("#lia-consultaCobros").addClass('active')
  $("#lia-consultaKardexValorizado").addClass('active')

  // Función para calcular totales de las columnas
  function calcularTotales() {
    let totalCaja = 0;
    let totalActivas = 0;
    let totalMorosos = 0;
    let totalRetiradas = 0;

    // Recorrer todas las filas de la tabla
    $('#tblKardexValorizado tbody tr').each(function () {
      const fila = $(this);

      // Obtener valores de las columnas (asumiendo que son las columnas 2, 4, 6, 8)
      const caja = parseFloat(fila.find('td:eq(2)').text().replace(/[,$]/g, '')) || 0;
      const activas = parseFloat(fila.find('td:eq(4)').text().replace(/[,$]/g, '')) || 0;
      const morosos = parseFloat(fila.find('td:eq(6)').text().replace(/[,$]/g, '')) || 0;
      const retiradas = parseFloat(fila.find('td:eq(8)').text().replace(/[,$]/g, '')) || 0;

      totalCaja += caja;
      totalActivas += activas;
      totalMorosos += morosos;
      totalRetiradas += retiradas;
    });

    // Actualizar los elementos del resumen
    $('#totalCaja').text('$' + totalCaja.toLocaleString('es-CO', { minimumFractionDigits: 0 }));
    $('#totalActivas').text('$' + totalActivas.toLocaleString('es-CO', { minimumFractionDigits: 0 }));
    $('#totalMorosos').text('$' + totalMorosos.toLocaleString('es-CO', { minimumFractionDigits: 0 }));
    $('#totalRetiradas').text('$' + totalRetiradas.toLocaleString('es-CO', { minimumFractionDigits: 0 }));
  }

  // Función que se ejecutará cuando la tabla esté lista
  $(document).ready(function () {
    // Verificar si la tabla ya está inicializada
    if ($.fn.DataTable.isDataTable('#tblKardexValorizado')) {
      // Si ya está inicializada, solo agregar el callback
      const tabla = $('#tblKardexValorizado').DataTable();

      // Agregar callback para calcular totales
      tabla.on('draw.dt', function () {
        calcularTotales();
      });

      // Calcular totales iniciales
      setTimeout(calcularTotales, 100);
    } else {
      // Si no está inicializada, esperar un poco y volver a verificar
      setTimeout(function () {
        if ($.fn.DataTable.isDataTable('#tblKardexValorizado')) {
          const tabla = $('#tblKardexValorizado').DataTable();
          tabla.on('draw.dt', function () {
            calcularTotales();
          });
          setTimeout(calcularTotales, 100);
        }
      }, 500);
    }
  });
</script>
