        function capitalizarPalabras(val) {
  //console.log(val)
  return val.toLowerCase()
    .trim()
    .split(' ')
    .map(v => (typeof (v[0]) == 'undefined') ? '' : v[0].toUpperCase() + v.substr(1))
    .join(' ');
}
