<div class="row">
    <div class="col-12">
        <div class="row">
            <div class="col-md-4">
                <div class="form-group has-success">

                    <input id="txtRefPersona" type="hidden" name="txtRefPersona" />
    
                    <label for="txt_Nombre">Nombre:</label>
                    <input id="txt_Nombre" type="text" maxlength="50" name="txt_Nombre" required="" class="form-control"
                        placeholder="Nombre Completo" autofocus="" value="" />
                </div>

            </div>

            <div class="col-md-4">
                <div class="form-group has-success">

                    <label for="txt_Apellido">Apellidos:</label>
                    <input value="" id="txt_Apellido" type="text" maxlength="50" name="txt_Apellido"
                        required="" class="form-control" placeholder="Apellidos..." autofocus="" />
                </div>

            </div>

            <div class="col-md-4">
                <div class="form-group has-success">
                    <label for="txt_RutaImgCli">Foto:</label>
                    <input id="imagen_Cli" type="file" class="form-control" name="imagen_Cli" />
                    <input id="txt_RutaImgCli" type="hidden" class="form-control" name="txt_RutaImgCli" />
                </div>

            </div>

        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Sexo">Sexo:</label>
                    <select name="txt_Sexo" id="txt_Sexo" class="form-control" required>
                        <option value="">--selecione--</option>
                        <option value="Hombre">Hombre</option>
                        <option value="Mujer">Mujer</option>
                        <option value="Otro">Otro</option>
                    </select>

                </div>

            </div>

            <div class="col-md-4">
                <div class="form-group has-success">
                    <label for="txt_fechaNacimiento">Fecha Nacimiento:</label>
                    <input id="txt_fechaNacimiento" type="date" maxlength="2" name="txt_fechaNacimiento"
                        class="form-control" placeholder="Fecha de Nacimiento" />
                </div>

            </div>
            <div class="col-md-5">
                <div class="form-group has-success">
                    <label for="txt_Ocupacion">Ocupacion:</label>
                    <input id="txt_Ocupacion" value="" type="text" maxlength="50" name="txt_Ocupacion" class="form-control"
                        placeholder="Ingrese el Ocopacion"/>
                </div>

            </div>
        </div>
        <div class="row">
            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_tipo_documento">Tipo Documento:</label>
                    <input id="txt_tipo_documentoHidden" type="hidden" maxlength="45" name="txt_tipo_documentoHidden"
                    placeholder="" class="form-control"  />
                    <input id="txt_tipo_documento" type="text" maxlength="45" name="txt_tipo_documento"
                        placeholder="" class="form-control" readonly />
                </div>

            </div>

            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_num_Documento">Documento:</label>
                    <input id="txt_num_DocumentoHidden" type="hidden" maxlength="45" name="txt_num_DocumentoHidden"
                        placeholder="" class="form-control"  />
                        <input id="txt_num_Documento" type="text" maxlength="45" name="txt_num_Documento"
                        placeholder="" class="form-control" readonly />
                </div>

            </div>

            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Telefono">Teléfono:</label>
                    <input id="txt_Telefono" value="" type="number" maxlength="13" name="txt_Telefono" class="form-control"
                        placeholder="Ingrese el teléfono" required="" />
                </div>

            </div>
            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Email">Email:</label>
                    <input id="txt_Email" type="email" maxlength="50" name="txt_Email" class="form-control"
                        placeholder="Ingrese el email" />
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Direccion_Departamento">Departamento:</label>
                    <input value="" id="txt_Direccion_Departamento" type="text" maxlength="45" name="txt_Direccion_Departamento"
                        placeholder="Departamento" class="form-control" />
                </div>

            </div>

            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Direccion_Provincia">Ciudad:</label>
                    <input value="" id="txt_Direccion_Provincia" type="text" maxlength="45" name="txt_Direccion_Provincia"
                        class="form-control" placeholder="Ciudad" required="" />
                </div>

            </div>

            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Direccion_Distrito">Barrio:</label>
                    <input value="" id="txt_Direccion_Distrito" type="text" maxlength="45" name="txt_Direccion_Distrito"
                        class="form-control" placeholder="Barrio" required />
                </div>

            </div>
            <div class="col-md-3">
                <div class="form-group has-success">
                    <label for="txt_Direccion_Calle">Direcion/Calle:</label>
                    <input value="" id="txt_Direccion_Calle" type="text" maxlength="45" name="txt_Direccion_Calle" placeholder=""
                        class="form-control" />
                </div>

            </div>
        </div>
        


    </div>
</div>
