<script type="text/javascript">
    $(function () {
        
        $('#modal-enrrutar').on('show.bs.modal', function (e) {
            cargarDatorParaOrdenar()
        })
    });
    /**;*/
    function cargarDatorParaOrdenar() {
        var tabla = $("#tblMoverEnrutar").DataTable({
            "responsive": true,
            "lengthChange": false,
            "autoWidth": false,
            dom: 'Bfrtip',
            "buttons": ["csv", "excel", "pdf"],
            "sort": false,
            "columns": [
                { "mDataProp": "0" },
                { "mDataProp": "1" },
                { "mDataProp": "2" },
                { "mDataProp": "3" },
                { "mDataProp": "4" },
                { "mDataProp": "5" },
                { "mDataProp": "6" }
            ],
            "bDestroy": true
        });



        var moverIndex = parseInt(sessionStorage.getItem("index"));
        $("#txtMoverNum").text((moverIndex+1))
        $("#txtMoverFoto").attr('src', ArrayTarjetas[moverIndex].foto)
        $("#txtMoverCliente").text(ArrayTarjetas[moverIndex].cliente)
        $("#txtMoverT_documento").text(ArrayTarjetas[moverIndex].t_documento)
        $("#txtMoverN_documento").text(ArrayTarjetas[moverIndex].n_documento)
        tabla.clear().draw();
        $.each(ArrayTarjetas, function (id, val) {
            if (id == moverIndex) {
            } else {

                const eventoAntes = (ArrayTarjetas[id - 1]?.refTarjeta === ArrayTarjetas[moverIndex].refTarjeta) ? '' : 'onclick="onclickMoverTarjetaOrdenar(\'' + ArrayTarjetas[moverIndex].refTarjeta + '\',' + CrearIten(ArrayTarjetas[(id - 1)]?.item ? parseFloat(ArrayTarjetas[id - 1].item) : parseFloat(ArrayTarjetas[id].item) - 1.5, parseFloat(ArrayTarjetas[id].item)) + ')"'
                const eventoDespues = (ArrayTarjetas[id + 1]?.refTarjeta === ArrayTarjetas[moverIndex].refTarjeta) ? '' : 'onclick="onclickMoverTarjetaOrdenar(\'' + ArrayTarjetas[moverIndex].refTarjeta + '\',' + CrearIten(parseFloat(ArrayTarjetas[id].item), ArrayTarjetas[(id + 1)]?.item ? parseFloat(ArrayTarjetas[id + 1].item) : parseFloat(ArrayTarjetas[id].item) + 1.5) + ')"'
                tabla.row
                    .add([
                        (id + 1),
                        '<span ' + eventoAntes + ' class="badge badge-success spanbtnMover " style="margin-bottom: 5px;">&nbsp;&nbsp;&nbsp;Antes&nbsp;&nbsp;&nbsp;</span>&nbsp;' +
                        '<span ' + eventoDespues + ' class="badge badge-success spanbtnMover">Despues</span>',
                        ` <div class="user-block">
                        <img class="img-circle img-bordered-sm" src="${ArrayTarjetas[id].foto}"
                            alt="cliente">
                        <span class="username">
                            <a href="#">${ArrayTarjetas[id].cliente}</a>
                        </span>
                        <span class="description">${ArrayTarjetas[id].t_documento}&nbsp; ${ArrayTarjetas[id].n_documento}</span>
                    </div>`,
                        ArrayTarjetas[id].resta,
                        parseFloat(ArrayTarjetas[id].ut_adi_valor),
                        ArrayTarjetas[id].costo,
                        ArrayTarjetas[id].valor
                    ])
                    .draw(false);
            }
        })
    }


    function onclickMoverTarjetaOrdenar(id, item) {
        
        $.post("./ajax/UsuarioAjax.php", function (r) {
            if (r === '0') {
                location.reload(true);
            }
        });
        Swal.fire({
            title: 'Mover Tarjeta?',
            text: "Estas a un cli de mover de lugar!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Si, Mover ahora!'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.close()
                $.post("./ajax/CarteraAjax.php?op=ordenarMover", { id, item }, function (e) {// llamamos la url de eliminar por post. y mandamos por parametro el id
                  
                    if (e.indexOf("ERROR:") !== -1) {
                        Toast.fire({
                            icon: 'error',
                            title: e
                        })
                    } else {
                       
                        Toast.fire({
                            icon: 'success',
                            title: e
                        })
                        $('#modal-enrrutar').modal('hide')
                        listarRuta();
                    }


                });
            }
        })
    }
</script>
